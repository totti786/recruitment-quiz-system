services:
  quiz:
    image: registry.testlab.local/recruitment-quiz:${TAG:-latest}
    container_name: quiz
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
    env_file: .env.production
    environment:
      # hardened defaults — can be overridden in .env.production
      DATABASE_URL: "file:/app/data/quiz.db"
      NODE_ENV: "production"
      PORT: "3001"
      CORS_ORIGIN: "https://quiz.testlab.local"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
