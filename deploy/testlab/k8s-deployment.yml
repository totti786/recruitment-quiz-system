apiVersion: v1
kind: Namespace
metadata:
  name: quiz
---
apiVersion: v1
kind: Secret
metadata:
  name: quiz-env
  namespace: quiz
type: Opaque
stringData:
  DATABASE_URL: "file:/app/data/quiz.db"
  JWT_SECRET: "REPLACE-WITH-openssl-rand-base64-32"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE-WITH-STRONG-PASSWORD"
  PORT: "3001"
  CORS_ORIGIN: "https://quiz.testlab.local"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quiz-data
  namespace: quiz
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz
  namespace: quiz
  labels: { app: quiz }
spec:
  replicas: 1   # SQLite — do not scale past 1
  selector:
    matchLabels: { app: quiz }
  template:
    metadata:
      labels: { app: quiz }
    spec:
      containers:
        - name: quiz
          image: registry.testlab.local/recruitment-quiz:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3001 }]
          envFrom:
            - secretRef: { name: quiz-env }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: quiz-data }
---
apiVersion: v1
kind: Service
metadata:
  name: quiz
  namespace: quiz
spec:
  selector: { app: quiz }
  type: NodePort
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30181
