stages: [build, publish, deploy]

variables:
  REGISTRY: registry.testlab.local
  IMAGE: $REGISTRY/recruitment-quiz:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $REGISTRY/recruitment-quiz:latest

# Socket-bound (runner host daemon) — privileged=false as-built
# The runner mounts /var/run/docker.sock, so jobs talk to the host daemon.
build:
  stage: build
  image: $REGISTRY/docker:24-dind
  script:
    - docker build --pull=false -t "$IMAGE" -t "$IMAGE_LATEST" .
    - docker image inspect "$IMAGE" >/dev/null

publish:
  stage: publish
  image: $REGISTRY/docker:24-dind
  script:
    - echo "$CI_REGISTRY_USER" | docker login "$REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin || true
    - docker push "$IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push "$IMAGE_LATEST"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# Pattern D deploy to control (10.11.204.9) — manual gate
deploy:control:
  stage: deploy
  image: $REGISTRY/alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 10.11.204.9 >> ~/.ssh/known_hosts
  script:
    - ssh root@10.11.204.9 "mkdir -p /opt/quiz/data"
    - scp deploy/testlab/docker-compose.yml deploy/testlab/.env.production root@10.11.204.9:/opt/quiz/
    - ssh root@10.11.204.9 "cd /opt/quiz && TAG=$CI_COMMIT_SHORT_SHA docker compose pull && TAG=$CI_COMMIT_SHORT_SHA docker compose up -d && docker compose ps && curl -sf http://localhost:3001/api/health"
  environment:
    name: production
    url: https://quiz.testlab.local
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual
