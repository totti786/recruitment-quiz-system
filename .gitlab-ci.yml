# Webhook-first pipeline (primary deploy path — no SSH in CI).
# Runner only curls lab-hook actions on control; control builds (offline tar),
# pushes to the local registry, and composes up. One secret: LAB_HOOK_TOKEN
# (group variable). First deploy needs /opt/quiz/.env.production on control —
# create once from deploy/testlab/.env.production.example (never committed).
stages: [build, deploy]

variables:
  REGISTRY: registry.testlab.local
  HOOK: http://10.11.204.9:9000/hook

build:
  stage: build
  image: $REGISTRY/alpine:latest
  script:
    - wget -qO- --header="X-Lab-Token: $LAB_HOOK_TOKEN"
        --post-data="{\"sha\":\"$CI_COMMIT_SHA\",\"ref\":\"$CI_COMMIT_REF\"}"
        "$HOOK/quiz-build"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

deploy:control:
  stage: deploy
  image: $REGISTRY/alpine:latest
  script:
    - wget -qO- --header="X-Lab-Token: $LAB_HOOK_TOKEN"
        --post-data="{\"tag\":\"$CI_COMMIT_SHORT_SHA\"}"
        "$HOOK/quiz-deploy"
  environment:
    name: production
    url: https://quiz.testlab.local
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
